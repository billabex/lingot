name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install

      - run: pnpm build

      - run: pnpm test

      - name: Verify tokens.json is up to date
        run: |
          pnpm --filter @billabex/ui-tokens build:figma
          git diff --exit-code packages/ui-tokens/tokens.json || {
            echo '::error::tokens.json is out of date. Run `pnpm --filter @billabex/ui-tokens build:figma` and commit the result.'
            exit 1
          }

      - name: Verify changeset
        run: pnpm changeset status --since=origin/main
